<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>Pages Dashboard · 我的站点</title>
  <meta name="description" content="所有 GitHub Pages 站点的今日要点与定时任务健康状况">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090c;
      --panel: #131318;
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --text-1: #eeeef2;
      --text-2: #a3a3b0;
      --text-3: #6a6a78;
      --accent: #818cf8;
      --accent-2: #c084fc;
      --grad: linear-gradient(120deg, #60a5fa 0%, #818cf8 45%, #c084fc 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(129,140,248,0.14);
      --glow-2: rgba(192,132,252,0.08);
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
      --up: #f87171;
      --down: #34d399;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
    }
    :root[data-theme="light"] {
      --bg: #f8f8fb;
      --panel: #ffffff;
      --hover: rgba(20,20,60,0.035);
      --line: rgba(20,20,60,0.08);
      --line-2: rgba(20,20,60,0.16);
      --text-1: #16161f;
      --text-2: #55556a;
      --text-3: #92929f;
      --accent: #4f46e5;
      --accent-2: #9333ea;
      --grid-dot: rgba(20,20,60,0.06);
      --glow-1: rgba(79,70,229,0.07);
      --glow-2: rgba(147,51,234,0.05);
      --ok: #059669;
      --warn: #d97706;
      --err: #dc2626;
      --up: #dc2626;
      --down: #059669;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(20,20,60,0.06);
    }

    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 420px at 12% -10%, var(--glow-1), transparent 70%),
        radial-gradient(800px 400px at 92% -5%, var(--glow-2), transparent 70%),
        radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }

    /* 顶栏（只有顶栏用毛玻璃；卡片多的页面给卡片加 backdrop-filter 会让 Chrome 丢合成层、整块空白） */
    .topbar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg) 72%, transparent); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
    .spacer { flex: 1; }
    .updated { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .layout { max-width: 1280px; margin: 0 auto; padding: 22px 20px 60px; display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 22px; }
    .aside { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 92px); overflow-y: auto; scrollbar-width: thin; }
    .panel { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }

    .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--text-2); margin-top: 4px; }

    /* 今日要点 */
    .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0 22px; }
    .kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .kpi .k { font-size: 12px; color: var(--text-3); font-weight: 600; }
    .kpi .v { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kpi .s { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 站点卡片 */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .card { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .card-head { display: flex; align-items: center; gap: 8px; }
    .card-head h3 { font-size: 15px; font-weight: 700; }
    .card-head .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .card-head .meta { font-size: 11.5px; color: var(--text-3); margin-left: 4px; white-space: nowrap; }
    .card-head .go { margin-left: auto; font-size: 12px; color: var(--text-2); padding: 3px 9px; border-radius: 8px; border: 1px solid var(--line); white-space: nowrap; }
    .card-head .go:hover { color: var(--text-1); border-color: var(--line-2); }
    .card-head .hide { color: var(--text-3); font-size: 15px; width: 24px; height: 24px; border-radius: 6px; line-height: 1; }
    .card-head .hide:hover { background: var(--hover); color: var(--text-1); }
    .card .err { color: var(--text-3); font-size: 13px; padding: 10px 0; }
    .skeleton { height: 120px; border-radius: 10px; background: linear-gradient(90deg, var(--hover), transparent, var(--hover)); background-size: 200% 100%; animation: sk 1.4s infinite; }
    @keyframes sk { to { background-position: -200% 0; } }

    .rows { display: flex; flex-direction: column; }
    .row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; min-width: 0; }
    .row:last-child { border-bottom: 0; }
    .row .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.row:hover .l { color: var(--accent); }
    .row .r { color: var(--text-3); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    .rank { width: 18px; flex-shrink: 0; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .row:nth-child(1) .rank { color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 10px 12px; border-radius: 10px; background: var(--hover); min-width: 0; }
    .stat .k { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .v { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .s { font-size: 11.5px; font-weight: 600; }
    .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--hover); color: var(--text-2); white-space: nowrap; }
    .b-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
    .b-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
    .b-err { color: var(--err); background: color-mix(in srgb, var(--err) 13%, transparent); }
    .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--text-3); }
    .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--hover); }
    .bar i { display: block; height: 100%; }
    .covers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .cover { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .cover .img { aspect-ratio: 3 / 2; border-radius: 10px; overflow: hidden; background: var(--hover); }
    .cover img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
    .cover b { font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cover span { font-size: 11px; color: var(--text-3); }

    /* 站点健康 */
    .health { padding: 16px; }
    .health h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .health .sum { font-size: 12px; color: var(--text-3); margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .site { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
    .site-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .site-top .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .site-top a.name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site-top a.name:hover { color: var(--accent); }
    .site-top .links { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
    .site-top .links a { font-size: 11.5px; color: var(--text-3); }
    .site-top .links a:hover { color: var(--text-1); }
    .site .info { font-size: 11.5px; color: var(--text-3); display: flex; gap: 10px; flex-wrap: wrap; padding-left: 16px; }
    .site .issue { font-size: 12px; padding-left: 16px; }
    .life { padding-left: 16px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); }
    .life .track { flex: 1; height: 4px; border-radius: 999px; background: var(--hover); overflow: hidden; }
    .life .fill { height: 100%; border-radius: 999px; }
    .restore { font-size: 12px; color: var(--text-3); margin-top: 14px; }
    .restore button { color: var(--accent); }
    .foot { font-size: 11.5px; color: var(--text-3); line-height: 1.7; }

    @media (max-width: 1080px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .aside { position: static; max-height: none; }
      .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 10px 16px; }
      .logo small, .updated { display: none; }
      .layout { padding: 16px 16px 50px; }
      .hero h1 { font-size: 20px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🧭</div>Pages Dashboard<small>我的站点</small></div>
      <div class="spacer"></div>
      <span class="updated" id="updated"></span>
      <a class="icon-btn" href="./" title="切换到大屏模式" style="width:auto;padding:0 10px;font-size:12.5px;font-weight:600">🖥 大屏</a>
      <button class="icon-btn" id="refresh" title="重新读取所有数据">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <a class="icon-btn" href="https://github.com/climb0516/pages-dashboard/actions/workflows/health.yml" target="_blank" rel="noopener" title="立即检查（在 GitHub Actions 点 Run workflow）">⚡</a>
      <button class="icon-btn" id="theme" title="切换主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <main>
      <section class="hero">
        <h1 id="greet">你好</h1>
        <p id="today"></p>
      </section>
      <div class="strip" id="strip"></div>
      <div class="grid" id="grid"></div>
      <div class="restore" id="restore"></div>
    </main>
    <aside class="aside" id="aside"></aside>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('pd:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pd:' + k, JSON.stringify(v)); } catch {} },
};
const ORIGIN = 'https://climb0516.github.io/';
const SUPABASE_URL = 'https://sqrzrvstlvxqxdxvhlxz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxcnpydnN0bHZ4cXhkeHZobHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTUzMjAsImV4cCI6MjA5NjU5MTMyMH0.C6Gz61TB3GhLnbDWywogGZDcqTu1G2ta9-Dyo60Yiho';   // tech-news 页面公开的 anon 只读 key

// ── 工具 ──
const getJSON = (url, opt = {}) => fetch(url, { cache: 'no-cache', ...opt }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
function ago(t) {
  if (!t) return '—';
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 0) return '刚刚';
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
function countdown(t) {
  const s = (new Date(t) - Date.now()) / 1000;
  if (s <= 0) return '进行中';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d} 天 ${h} 小时` : h ? `${h} 小时 ${m} 分` : `${m} 分钟`;
}
const fmtCST = t => new Date(t).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const pct = v => `${v > 0 ? '+' : ''}${v.toFixed(2)}%`;
const cls = v => v > 0.0001 ? 'up' : v < -0.0001 ? 'down' : 'muted';
const within = (t, days) => t && Date.now() - new Date(t) < days * 86400000;

// ── 各站卡片：load 拉数据，render 产出 HTML，kpi 给顶部「今日要点」 ──
const KPI = {};
const SITES = [
  {
    repo: 'fx-board', title: '💱 汇率', color: '#2dd4bf',
    load: () => getJSON(ORIGIN + 'fx-board/data.json'),
    render(d) {
      const R = d.ref.rates, days = Object.keys(d.history).sort();
      const h = (day, a, b) => { const x = { USD: 1, ...d.history[day] }; return x[b] / x[a]; };
      const chg = (a, b) => (h(days.at(-1), a, b) / h(days.at(-2), a, b) - 1) * 100;
      const pairs = [['USD', 'CNY'], ['HKD', 'CNY'], ['USD', 'HKD']];
      const cfDay = Object.keys(d.cfets).sort().pop(), cf = d.cfets[cfDay];
      const gap = cf ? (cf.USD / R.CNY - 1) * 100 : null;
      const pos = Math.min(100, Math.max(0, (R.HKD - 7.75) / 0.1 * 100));
      KPI.fx = { k: 'USD/CNY', v: (R.CNY).toFixed(4), s: `日 ${pct(chg('USD', 'CNY'))} · HKD/CNY ${(R.CNY / R.HKD).toFixed(4)}`, url: ORIGIN + 'fx-board/' };
      return `<div class="stats">${pairs.map(([a, b]) => {
          const c = chg(a, b);
          return `<div class="stat"><div class="k">${a}/${b}</div><div class="v num">${(R[b] / R[a]).toFixed(4)}</div><div class="s num ${cls(c)}">${pct(c)}</div></div>`;
        }).join('')}</div>
        <div class="rows">
          <div class="row"><span class="l">联系汇率位置（7.75 ~ 7.85）</span><span class="r num">${R.HKD.toFixed(4)} · ${pos >= 90 ? '贴近弱方' : pos <= 10 ? '贴近强方' : '区间内'}</span></div>
          ${gap !== null ? `<div class="row"><span class="l">人民币中间价 ${cf.USD.toFixed(4)} vs 市场价</span><span class="r num">市场价${gap > 0 ? '强' : '弱'} ${Math.abs(gap).toFixed(2)}%</span></div>` : ''}
        </div>`;
    },
  },
  {
    repo: 'earnings-calendar', title: '📅 财报宏观', color: '#fbbf24',
    load: () => getJSON(ORIGIN + 'earnings-calendar/data.json'),
    render(d) {
      const now = Date.now();
      const macro = d.macro.filter(m => m.time && new Date(m.time) > now).sort((a, b) => new Date(a.time) - new Date(b.time));
      const nextHigh = macro.find(m => m.impact === 'High');
      const fomc = macro.find(m => m.kind === 'fomc');
      const week = new Date(d.today_et); week.setDate(week.getDate() + 7);
      const weekISO = week.toISOString().slice(0, 10);
      const ern = d.earnings.filter(e => e.watch && e.date >= d.today_et && e.date <= weekISO).sort((a, b) => a.date.localeCompare(b.date));
      const T = { bmo: '盘前', amc: '盘后', tbd: '待定' };
      if (nextHigh) KPI.macro = { k: '下一个高影响事件', v: countdown(nextHigh.time), s: nextHigh.title, url: ORIGIN + 'earnings-calendar/' };
      return `<div class="stats">
          <div class="stat"><div class="k">下一个高影响</div><div class="v">${nextHigh ? countdown(nextHigh.time) : '—'}</div><div class="s muted">${esc(nextHigh?.title || '')}</div></div>
          <div class="stat"><div class="k">下次 FOMC</div><div class="v">${fomc ? countdown(fomc.time) : '—'}</div><div class="s muted">${fomc ? fmtCST(fomc.time) : ''}</div></div>
          <div class="stat"><div class="k">7 天内关注财报</div><div class="v">${ern.length} 家</div><div class="s muted">${d.watchlist ? Object.keys(d.watchlist).length + ' 家关注' : ''}</div></div>
        </div>
        <div class="rows">${ern.slice(0, 5).map(e => `<div class="row"><span class="l"><b>${esc(e.symbol)}</b> <span class="muted">${esc(e.name)}</span></span><span class="r">${e.date.slice(5)} ${T[e.time] || ''}</span></div>`).join('') || '<div class="row"><span class="l muted">未来 7 天关注公司没有财报</span></div>'}</div>`;
    },
  },
  {
    repo: 'nasdaq-dca', title: '📈 纳指定投', color: '#60a5fa',
    load: () => getJSON(ORIGIN + 'nasdaq-dca/data.json'),
    render(d) {
      const byCode = Object.fromEntries(d.funds.map(f => [f.code, f]));
      const plan = d.plan.map(p => ({ ...p, f: byCode[p.code] })).filter(p => p.f);
      const open = d.funds.filter(f => f.status !== '暂停').length;
      return `<div class="stats">
          <div class="stat"><div class="k">纳指基金</div><div class="v">${d.funds.length} 只</div></div>
          <div class="stat"><div class="k">可申购</div><div class="v">${open} 只</div></div>
          <div class="stat"><div class="k">我的计划</div><div class="v">${plan.length} 只</div></div>
        </div>
        <div class="rows">${plan.slice(0, 6).map(p => {
          const st = p.f.status === '暂停' ? 'b-err' : /限/.test(p.f.status_raw || p.f.status) ? 'b-warn' : 'b-ok';
          return `<div class="row"><span class="l">${esc(p.f.name)} <span class="muted">${esc(p.app || '')}</span></span><span class="badge ${st}">${esc(p.f.status_raw || p.f.status)}</span></div>`;
        }).join('')}</div>`;
    },
  },
  {
    repo: 'hot-news', title: '🔥 全网热榜', color: '#ff5a3c',
    load: () => getJSON(ORIGIN + 'hot-news/data.json'),
    render(d) {
      const ev = d.events.slice(0, 6);

// ── 卡片渲染 ──
let HEALTH = null;
const hidden = new Set(store.get('hidden', []));
const cache = {};
function healthOf(repo) { return HEALTH?.repos.find(r => r.name === repo); }
function cardShell(s, body) {
  const h = healthOf(s.repo);
  const lv = h?.level || 'ok';
  return `<article class="panel card" id="card-${s.repo}">
    <div class="card-head">
      <span class="dot" style="background:${s.color}"></span><h3>${s.title}</h3>
      ${h && lv !== 'ok' ? `<span class="badge ${lv === 'error' ? 'b-err' : 'b-warn'}">${lv === 'error' ? '异常' : '注意'}</span>` : ''}
      <span class="meta">${cache[s.repo]?.updated ? '数据 ' + ago(cache[s.repo].updated) : ''}</span>
      <a class="go" href="${ORIGIN}${s.repo}/" target="_blank" rel="noopener">进入 →</a>
      <button class="hide" data-hide="${s.repo}" title="隐藏这张卡片">×</button>
    </div>
    ${body}
  </article>`;
}
function renderCard(s) {
  const el = document.getElementById('card-' + s.repo);
  if (!el) return;
  const c = cache[s.repo];
  let body;
  if (!c) body = '<div class="skeleton"></div>';
  else if (c.error) body = `<div class="err">读取失败（${esc(c.error)}），稍后点右上角 ↻ 重试</div>`;
  else {
    try { body = s.render(c.data); }
    catch (e) { console.warn('[Dashboard]', s.repo, e); body = '<div class="err">数据格式已变化，这张卡片需要更新</div>'; }
  }
  el.outerHTML = cardShell(s, body);
}
function renderGrid() {
  const visible = SITES.filter(s => !hidden.has(s.repo));
  $('#grid').innerHTML = visible.map(s => cardShell(s, '<div class="skeleton"></div>')).join('');
  visible.forEach(renderCard);
  const hid = SITES.filter(s => hidden.has(s.repo));
  $('#restore').innerHTML = hid.length ? `已隐藏 ${hid.map(s => s.title).join('、')} · <button data-restore>全部恢复</button>` : '';
}
function updatedOf(data) {
  const d = Array.isArray(data) ? data[data.length - 1] : data;
  return d?.updated || d?.updated_at || null;
}

function renderStrip() {
  const h = HEALTH?.repos || [];
  const bad = h.filter(r => r.level === 'error').length, warn = h.filter(r => r.level === 'warn').length;

  ];

// ── 站点健康 ──
function renderHealth() {
  if (!HEALTH) { $('#aside').innerHTML = '<div class="panel health"><h3>🩺 站点健康</h3><div class="skeleton"></div></div>'; return; }
  const rs = HEALTH.repos;
  const n = l => rs.filter(r => r.level === l).length;
  const LV = { ok: 'var(--ok)', warn: 'var(--warn)', error: 'var(--err)' };
  const sites = rs.map(r => {
    const wf = r.workflows || [];
    const hasCron = wf.some(w => w.cron);
    const last = wf.map(w => w.last_run?.created_at).filter(Boolean).sort().pop();
    const fail = wf.some(w => w.last_run?.conclusion && !['success', 'skipped'].includes(w.last_run.conclusion));
    const left = Math.max(0, r.days_left ?? 0), lifePct = Math.min(100, left / 60 * 100);
    const lifeColor = left < 7 ? 'var(--err)' : left < 14 ? 'var(--warn)' : 'var(--ok)';
    return `<div class="site">
      <div class="site-top"><span class="dot" style="background:${LV[r.level] || 'var(--text-3)'}"></span>
        <a class="name" href="${esc(r.page)}" target="_blank" rel="noopener">${esc(r.name)}</a>
        <span class="links"><a href="${esc(r.repo_url)}/actions" target="_blank" rel="noopener">Actions</a><a href="${esc(r.repo_url)}" target="_blank" rel="noopener">仓库</a></span></div>
      <div class="info">${wf.length ? `<span>最近运行 ${ago(last)}${fail ? ' · <span style="color:var(--err)">失败</span>' : ''}</span>` : '<span>静态页面，无定时任务</span>'}
        ${wf.filter(w => w.cron).map(w => `<span title="${esc(w.name)}">⏱ ${w.interval_h >= 24 ? '每天' : '每 ' + w.interval_h + ' 小时'}</span>`).join('')}
        ${r.page_status !== 200 ? `<span style="color:var(--err)">页面 ${r.page_status || '无法访问'}</span>` : ''}</div>
      ${hasCron ? `<div class="life" title="公开仓库 60 天无提交，定时任务会被 GitHub 停用"><span>停用倒计时</span><div class="track"><div class="fill" style="width:${lifePct}%;background:${lifeColor}"></div></div><span class="num">${left.toFixed(0)} 天</span></div>` : ''}
      ${r.issues.map(i => `<div class="issue" style="color:${i.level === 'error' ? 'var(--err)' : 'var(--warn)'}">${esc(i.text)}</div>`).join('')}
    </div>`;
  }).join('');
  $('#aside').innerHTML = `<div class="panel health">
    <h3>🩺 站点健康</h3>
    <div class="sum"><span style="color:var(--ok)">● 正常 ${n('ok')}</span><span style="color:var(--warn)">● 注意 ${n('warn')}</span><span style="color:var(--err)">● 异常 ${n('error')}</span><span>检查于 ${ago(HEALTH.updated)}</span></div>
    ${sites}
    <div class="foot" style="margin-top:10px">每小时由 GitHub Actions 自动检查：页面能否访问、定时任务是否被停用、最近一次运行是否失败、是否太久没运行。自动发现所有开启了 Pages 的仓库。</div>
  </div>`;
}

// ── 加载 ──
async function load() {
  $('#refresh').classList.add('spin');
  const tasks = [
    getJSON('health.json').then(h => { HEALTH = h; }).catch(() => {}).finally(() => { renderHealth(); renderStrip(); SITES.forEach(renderCard); }),
    ...SITES.map(s => s.load()
      .then(data => { cache[s.repo] = { data, updated: updatedOf(data) }; })
      .catch(e => { if (!cache[s.repo]?.data) cache[s.repo] = { error: e.message || '网络错误' }; })
      .finally(() => { renderCard(s); renderStrip(); })),
  ];
  await Promise.allSettled(tasks);
  $('#updated').textContent = '刷新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
  $('#refresh').classList.remove('spin');
}

function greet() {
  const now = new Date(), h = now.getHours();
  $('#greet').innerHTML = `${h < 6 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好'}，这是<em>今天的要点</em>`;
  $('#today').textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-hide],[data-restore]');
  if (!t) return;
  if (t.dataset.hide) hidden.add(t.dataset.hide); else hidden.clear();
  store.set('hidden', [...hidden]);
  renderGrid();
});
$('#refresh').addEventListener('click', load);
function applyTheme(t) { document.documentElement.dataset.theme = t; }
applyTheme(store.get('theme', 'dark'));
$('#theme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
});

greet();
renderGrid();
renderHealth();
renderStrip();
load();
setInterval(load, 10 * 60 * 1000);
setInterval(() => { greet(); SITES.forEach(renderCard); renderStrip(); }, 60 * 1000);   // 倒计时每分钟刷新
</script>
</body>
</html>
