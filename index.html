<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Pages · 今日</title>
  <meta name="description" content="所有 GitHub Pages 站点的今日要点与定时任务健康状况">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%238b9cff'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0b0c;
      --card: #151517;
      --card-2: #1c1c1f;
      --hair: rgba(255,255,255,0.06);
      --hair-2: rgba(255,255,255,0.10);
      --text-1: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #6e6e73;
      --accent: #8b9cff;
      --up: #ff6b6b;
      --down: #3ddc97;
      --ok: #3ddc97;
      --warn: #f5b94a;
      --err: #ff6b6b;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text-1); overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      font-feature-settings: 'tnum' 1, 'cv11' 1;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* 1920×1080 画布，等比缩放铺满窗口 */
    #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0;
      padding: 28px 40px 36px; display: grid; grid-template-rows: 56px 1fr; gap: 20px;
      background: radial-gradient(1100px 380px at 50% -120px, rgba(139,156,255,0.10), transparent 70%); }

    header { display: flex; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: baseline; gap: 14px; }
    .brand b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    .brand b::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(139,156,255,0.18); }
    .brand span { color: var(--text-2); font-size: 16px; }
    .spacer { flex: 1; }
    .meta { color: var(--text-3); font-size: 13px; }
    .clock { font-size: 24px; font-weight: 500; letter-spacing: -0.01em; min-width: 72px; text-align: right; }
    .pill { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--hair-2); color: var(--text-2); font-size: 13.5px; display: inline-flex; align-items: center; }
    .pill:hover { color: var(--text-1); border-color: rgba(255,255,255,0.22); }

    /* 便当格：12 列 × 4 行 */
    .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 16px; min-height: 0; }
    .card { position: relative; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; padding: 22px 24px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .card > * { flex-shrink: 0; }   /* 内容不被 flex 压扁裁字，只有图表 / 列表区可伸缩 */
    .card > .spark, .card > .rows, .card > .sites, .card > .drama { flex-shrink: 1; }
    .c-fx { grid-column: 1 / 6; grid-row: 1 / 3; }
    .c-hot { grid-column: 1 / 4; grid-row: 3; }
    .c-oil { grid-column: 1 / 4; grid-row: 4; }
    .c-save { grid-column: 4 / 6; grid-row: 3; }
    .c-resp { grid-column: 4 / 6; grid-row: 4; }
    .c-health { grid-column: 6 / 10; grid-row: 1 / 4; }
    .c-holiday { grid-column: 6 / 10; grid-row: 4; }
    .c-macro { grid-column: 10 / 13; grid-row: 1; }
    .c-ern { grid-column: 10 / 13; grid-row: 2; }
    .c-apps { grid-column: 10 / 13; grid-row: 3; }
    .c-apps .label { margin-bottom: 8px; }
    .c-drama { grid-column: 10 / 13; grid-row: 4; }

    .label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-2); font-weight: 500; margin-bottom: 14px; white-space: nowrap; }
    .label a.go { margin-left: auto; color: var(--text-3); font-size: 12.5px; font-weight: 400; }
    .label a.go:hover { color: var(--text-1); }
    .label .r { margin-left: auto; color: var(--text-3); font-size: 12.5px; font-weight: 400; }
    .big { font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
    .sub { color: var(--text-2); font-size: 14px; }
    .dim { color: var(--text-3); }
    .up { color: var(--up); } .down { color: var(--down); }
    .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .loading { color: var(--text-3); font-size: 14px; }

    /* 汇率 */
    .fx-top { display: flex; align-items: flex-end; gap: 16px; }
    .fx-top .big { font-size: 84px; }
    .fx-chg { font-size: 22px; font-weight: 500; padding-bottom: 8px; }
    .fx-pairs { display: flex; gap: 26px; margin-left: auto; padding-bottom: 6px; }
    .fx-pairs div { display: flex; flex-direction: column; }
    .fx-pairs span { font-size: 13px; color: var(--text-3); }
    .fx-pairs b { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
    .fx-pairs i { font-style: normal; font-size: 13px; }
    .spark { flex: 1; min-height: 0; margin: 26px 0 12px; position: relative; }
    .spark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .fx-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding-top: 16px; border-top: 1px solid var(--hair); }
    .fx-foot .k { font-size: 12.5px; color: var(--text-3); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .fx-foot .k b { color: var(--text-1); font-weight: 600; }
    .track { position: relative; height: 4px; border-radius: 999px; background: var(--card-2); margin-top: 12px; }
    .track .dot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--text-1); transform: translate(-50%, -50%); box-shadow: 0 0 0 4px var(--card); }
    .track-scale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); margin-top: 8px; }

    /* 列表 */
    .rows { display: flex; flex-direction: column; min-height: 0; }
    .row { display: flex; align-items: center; gap: 14px; height: 44px; border-bottom: 1px solid var(--hair); font-size: 15px; min-width: 0; }
    .row:last-child { border-bottom: 0; }
    a.row:hover .ell { color: var(--accent); }
    .rk { width: 20px; flex-shrink: 0; color: var(--text-3); font-weight: 600; font-size: 14px; }
    .rk.top { color: var(--text-1); }
    .row .r { margin-left: auto; color: var(--text-3); font-size: 13px; white-space: nowrap; flex-shrink: 0; }

    /* 定投 */
    .seg { display: flex; height: 6px; gap: 3px; margin: 16px 0 10px; }
    .seg i { border-radius: 999px; }
    .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
    .legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--c); vertical-align: 1px; }

    /* 站点健康 */
    .h-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 6px; }
    .h-head .big { font-size: 64px; }
    .h-head .sub { padding-bottom: 6px; }
    .chips { display: flex; gap: 8px; margin: 10px 0 14px; }
    .chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--card-2); color: var(--text-2); }
    .chip::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
    .sites { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .site { flex: 1; display: grid; grid-template-columns: 10px minmax(0, 1fr) 96px 120px 44px; align-items: center; gap: 14px;
      padding: 0 12px; margin: 0 -12px; border-radius: 12px; min-height: 0; }
    .site + .site { border-top: 1px solid var(--hair); }
    .site:hover { background: rgba(255,255,255,0.025); }
    .site.bad { background: rgba(255,107,107,0.07); border-top-color: transparent; }
    .site.bad + .site { border-top-color: transparent; }
    .site.warning { background: rgba(245,185,74,0.06); border-top-color: transparent; }
    .site .st { width: 8px; height: 8px; border-radius: 50%; }
    .site .nm { min-width: 0; }
    .site .nm b { display: block; font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .nm small { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .when { font-size: 13px; color: var(--text-2); text-align: right; white-space: nowrap; }
    .life { height: 4px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
    .life i { display: block; height: 100%; border-radius: 999px; }
    .site .left { font-size: 13px; color: var(--text-2); text-align: right; }

    /* 右列 */
    .macro-cd { font-size: 50px; }
    .macro-cd small { font-size: 24px; font-weight: 500; color: var(--text-2); letter-spacing: -0.01em; margin: 0 6px 0 2px; }
    .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--text-2); margin-top: auto; padding-top: 12px; border-top: 1px solid var(--hair); }
    .kv b { color: var(--text-1); font-weight: 500; }
    .tickers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tk { background: var(--card-2); border-radius: 12px; padding: 9px 12px; min-width: 0; }
    .tk b { font-size: 15px; font-weight: 600; }
    .tk span { display: block; font-size: 12px; color: var(--text-3); }
    .app { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto 52px; align-items: center; gap: 12px; height: 42px; }
    .app img { width: 32px; height: 32px; border-radius: 8px; }
    .app b { display: block; font-size: 14.5px; font-weight: 500; }
    .app small { display: block; font-size: 12px; color: var(--text-3); }
    .app .pos { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; text-align: right; }
    .app .star { font-size: 13px; color: var(--text-2); text-align: right; }
    .gripe { font-size: 12.5px; color: var(--text-3); margin-top: auto; padding-top: 4px; }
    .gripe b { color: var(--text-1); font-weight: 500; }

    .drama { position: relative; flex: 1; min-height: 0; }
    .slide { position: absolute; inset: 0; display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 16px; align-content: start; opacity: 0; transition: opacity .9s ease; pointer-events: none; }
    .slide.on { opacity: 1; pointer-events: auto; }
    .slide .cv { width: 80px; height: 112px; border-radius: 10px; overflow: hidden; background: var(--card-2); }
    .slide .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slide b { font-size: 16px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .slide .tag { font-size: 12.5px; color: var(--accent); margin: 6px 0 4px; }
    .slide p { font-size: 12.5px; color: var(--text-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .senti { padding-top: 10px; border-top: 1px solid var(--hair); }
    .senti .k { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-3); margin-bottom: 8px; }

    .c-hot .row { height: 36px; font-size: 14px; }
    /* 小卡片：一个主数字 + 两行要点 */
    .mini-big { font-size: 46px; }
    .mini-big small { font-size: 18px; font-weight: 500; color: var(--text-2); margin-left: 4px; letter-spacing: -0.01em; }
    .mini-lines { margin-top: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-2); }
    .mini-lines b { color: var(--text-1); font-weight: 500; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; }
    .duo > div { display: flex; flex-direction: column; min-width: 0; }
    .duo > div + div { border-left: 1px solid var(--hair); padding-left: 20px; }

    /* 手机：不缩放，单列 */
    @media (max-width: 760px) {
      body { overflow: auto; }
      #stage { position: static; width: auto; height: auto; transform: none !important; padding: 16px 16px 32px; display: block; }
      header { flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
      header .meta { display: none; }
      .bento { display: flex; flex-direction: column; }
      .card { min-height: 220px; }
      .c-fx { min-height: 520px; }
      .c-health { min-height: 860px; }
      .fx-top .big { font-size: 64px; }
      .fx-top { flex-wrap: wrap; }
      .fx-pairs { gap: 20px; margin-left: 0; width: 100%; }
      .fx-foot { grid-template-columns: 1fr; gap: 18px; }
      .spark { flex: none; height: 140px; }
      .c-fx { min-height: 0; }
      .site { grid-template-columns: 10px minmax(0, 1fr) 70px 60px 36px; gap: 10px; }
    }
  </style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><b>Pages</b><span id="date"></span></div>
    <div class="spacer"></div>
    <span class="meta" id="metaLine"></span>
    <span class="clock" id="clock">--:--</span>
    <button class="pill" id="fs" title="全屏（F）">全屏</button>
    <a class="pill" href="detail.html">详情</a>
  </header>

  <div class="bento">
    <section class="card c-fx" id="fx"><div class="label">汇率</div><div class="loading">加载中…</div></section>
    <section class="card c-hot"><div class="label">全网热榜<a class="go" href="https://climb0516.github.io/hot-news/" target="_blank" rel="noopener">hot-news ↗</a></div><div class="rows" id="hot"><div class="loading">加载中…</div></div></section>
    <section class="card c-oil" id="oil"><div class="label">油价 · 金价</div><div class="loading">加载中…</div></section>
    <section class="card c-save" id="save"><div class="label">存款利率</div><div class="loading">加载中…</div></section>
    <section class="card c-resp" id="resp"><div class="label">呼吸道</div><div class="loading">加载中…</div></section>
    <section class="card c-health" id="health"><div class="label">站点健康</div><div class="loading">加载中…</div></section>
    <section class="card c-holiday" id="holiday"><div class="label">拼假</div><div class="loading">加载中…</div></section>
    <section class="card c-macro" id="macro"><div class="label">下一个高影响事件</div><div class="loading">加载中…</div></section>
    <section class="card c-ern" id="ern"><div class="label">本周关注财报</div><div class="loading">加载中…</div></section>
    <section class="card c-apps" id="apps"><div class="label">竞品</div><div class="loading">加载中…</div></section>
    <section class="card c-drama" id="drama"><div class="label">短剧</div><div class="loading">加载中…</div></section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORIGIN = 'https://climb0516.github.io/';
const REFRESH_MS = 10 * 60 * 1000;
const LV = { ok: 'var(--ok)', warn: 'var(--warn)', error: 'var(--err)' };

// ── 工具（与 detail.html 保持一致） ──
const getJSON = (url, opt = {}) => fetch(url, { cache: 'no-cache', ...opt }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
function ago(t) {
  if (!t) return '—';
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
function cdParts(t) {                                   // 倒计时拆成 [[数, 单位], ...]，只取前两段
  const s = Math.max(0, (new Date(t) - Date.now()) / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? [[d, '天'], [h, '小时']] : h ? [[h, '小时'], [m, '分']] : [[m, '分钟']]);
}
const cdText = t => cdParts(t).map(([n, u]) => n + u).join(' ');
const fmtCST = t => new Date(t).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const pct = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(2)}%`;
const cls = v => v > 0.0001 ? 'up' : v < -0.0001 ? 'down' : 'dim';
const within = (t, days) => t && Date.now() - new Date(t) < days * 86400000;
const label = (text, go) => `<div class="label">${text}${go ? `<a class="go" href="${ORIGIN}${go}/" target="_blank" rel="noopener">${go} ↗</a>` : ''}</div>`;

// ── 汇率 ──
function renderFx(d) {
  const R = d.ref.rates, days = Object.keys(d.history).sort();
  const h = (day, a, b) => { const x = { USD: 1, ...d.history[day] }; return x[b] / x[a]; };
  const chg = (a, b) => (h(days.at(-1), a, b) / h(days.at(-2), a, b) - 1) * 100;
  const c = chg('USD', 'CNY');
  const recent = days.slice(-90), vals = recent.map(x => h(x, 'USD', 'CNY'));
  const min = Math.min(...vals), max = Math.max(...vals), W = 700, H = 160;
  const X = i => i / (vals.length - 1) * W, Y = v => 8 + (1 - (v - min) / ((max - min) || 1)) * (H - 16);
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const pos = Math.min(100, Math.max(0, (R.HKD - 7.75) / 0.1 * 100));
  const cf = d.cfets || {}, cfDay = Object.keys(cf).sort().pop(), gap = cfDay ? (cf[cfDay].USD / R.CNY - 1) * 100 : null;
  const chg90 = (vals.at(-1) / vals[0] - 1) * 100;
  $('#fx').innerHTML = label('美元 / 人民币', 'fx-board') + `
    <div class="fx-top"><span class="big">${R.CNY.toFixed(4)}</span><span class="fx-chg ${cls(c)}">${pct(c)}</span>
    <div class="fx-pairs">${[['HKD', 'CNY'], ['USD', 'HKD'], ['EUR', 'CNY']].map(([a, b]) => {
      const x = chg(a, b);
      return `<div><span>${a}/${b}</span><b>${(R[b] / R[a]).toFixed(4)}</b><i class="${cls(x)}">${pct(x)}</i></div>`;
    }).join('')}</div></div>
    <div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="fxg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b9cff" stop-opacity=".22"/><stop offset="1" stop-color="#8b9cff" stop-opacity="0"/></linearGradient></defs>
      <path d="${line}L${W},${H}L0,${H}Z" fill="url(#fxg)"/>
      <path d="${line}" fill="none" stroke="#8b9cff" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg></div>
    <div class="sub" style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:16px">
      <span class="dim">近 90 日 · ${recent[0].slice(5)} – ${recent.at(-1).slice(5)}</span>
      <span><span class="dim">高</span> ${max.toFixed(4)} <span class="dim" style="margin-left:10px">低</span> ${min.toFixed(4)} <span class="${cls(chg90)}" style="margin-left:10px">${pct(chg90)}</span></span></div>
    <div class="fx-foot">
      <div><div class="k"><span>联系汇率 USD/HKD</span><b>${R.HKD.toFixed(4)}</b></div>
        <div class="track"><span class="dot" style="left:${pos}%"></span></div>
        <div class="track-scale"><span>7.75</span><span>${pos >= 90 ? '贴近弱方兑换保证' : pos <= 10 ? '贴近强方兑换保证' : '区间内'}</span><span>7.85</span></div></div>
      <div><div class="k"><span>人民币中间价</span><b>${cfDay ? cf[cfDay].USD.toFixed(4) : '—'}</b></div>
        <div class="sub" style="font-size:13.5px;margin-top:6px">${gap !== null ? `市场价比中间价${gap > 0 ? '强' : '弱'} <b style="color:var(--text-1);font-weight:500">${Math.abs(gap).toFixed(2)}%</b>` : ''}</div>
        <div class="dim" style="font-size:12px;margin-top:4px">${gap !== null ? `用中间价折算美元资产会${gap > 0 ? '偏高' : '偏低'}` : ''}</div></div>
    </div>`;
}

// ── 存款利率 ──
function renderSave(d) {
  const today = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
  const bond = t => d.bonds.flatMap(b => b.items).find(i => i.term === t)?.rate;
  const live = d.bonds.find(b => b.start <= today && today <= b.end);
  // 下期国债：已有公告用公告日期，否则按 3–11 月每月 10 日推算
  let next = d.bonds.filter(b => b.start > today).sort((a, b) => a.start.localeCompare(b.start))[0]?.start;
  if (!next) {
    let y = +today.slice(0, 4), m = +today.slice(5, 7) + (+today.slice(8, 10) > 10 ? 1 : 0);
    if (m > 11 || m < 3) { if (m > 11) y++; m = 3; }
    next = `${y}-${String(m).padStart(2, '0')}-10`;
  }
  const days = Math.round((new Date(next) - new Date(today)) / 86400000);
  $('#save').innerHTML = label('大行 3 年定期', 'savings-rates') + `
    <div class="big mini-big">${d.deposit.rates['3年'].toFixed(2)}<small>%</small></div>
    <div class="mini-lines"><span>储蓄国债 <b>${bond(3)?.toFixed(2) ?? '—'}% / ${bond(5)?.toFixed(2) ?? '—'}%</b></span>
      <span>下期国债 <b>${live ? '发售中' : days + ' 天后'}</b>${live ? '' : ` · ${+next.slice(5, 7)}月${+next.slice(8, 10)}日`}</span></div>`;
}

// ── 呼吸道 ──
function renderResp(d) {
  const w = d.weeks[0];
  const SHORT = { '新型冠状病毒': '新冠', '流感病毒': '流感', '呼吸道合胞病毒': '合胞病毒', '人偏肺病毒': '人偏肺', '副流感病毒': '副流感' };
  const [name, top] = Object.entries(w.outpatient).sort((a, b) => b[1].rate - a[1].rate)[0] || [];
  const chg = c => c == null ? '' : `<span class="${c > 0 ? 'up' : c < 0 ? 'down' : 'dim'}">${c > 0 ? '↑' : c < 0 ? '↓' : ''}${c ? Math.abs(c).toFixed(1) : '持平'}</span>`;
  const cv = w.outpatient['新型冠状病毒'];
  $('#resp').innerHTML = label(`呼吸道 · 第 ${w.week} 周`, 'health-weekly') + `
    <div class="big mini-big">${esc(SHORT[name] || name || '—')}<small>${top ? top.rate + '%' : ''} ${chg(top?.chg)}</small></div>
    <div class="mini-lines"><span>南方 <b>${esc((w.level?.south || '—').replace('水平', ''))}</b> · 北方 <b>${esc((w.level?.north || '—').replace('水平', ''))}</b></span>
      <span>新冠 <b>${cv?.rate ?? '—'}%</b> ${chg(cv?.chg)}</span></div>`;
}

// ── 油价金价（国内习惯：涨红跌绿）──
function renderOil(d) {
  const o = d.oil, e = o.estimate || {}, au = d.gold?.quotes?.au9999;
  const vc = e.verdict === '上调' ? 'up' : e.verdict === '下调' ? 'down' : 'dim';
  const brand = (d.gold?.brands || []).find(b => !/批发/.test(b.name));
  $('#oil').innerHTML = label('油价 · 金价', 'oil-gold') + `<div class="duo">
    <div><span class="sub" style="font-size:12.5px">下次油价调整</span>
      <div class="big mini-big">${o.next_window?.days ?? '—'}<small>天</small></div>
      <div class="mini-lines"><span>本轮预测 <b class="${vc}">${esc(e.verdict || '—')}</b>${e.verdict && e.verdict !== '搁浅' ? ` 约 ${Math.abs(e.est_ton)} 元/吨` : ''}</span>
        <span>92# 全国均价 <b>${o.national?.v92 ?? '—'}</b> 元/升</span></div></div>
    <div><span class="sub" style="font-size:12.5px">上金所 Au9999</span>
      <div class="big mini-big">${au ? au.price.toFixed(0) : '—'}<small>元/克</small></div>
      <div class="mini-lines"><span>今日 <b class="${au?.chg_pct > 0 ? 'up' : au?.chg_pct < 0 ? 'down' : 'dim'}">${au ? (au.chg_pct > 0 ? '+' : '') + au.chg_pct.toFixed(2) + '%' : '—'}</b></span>
        <span>${brand ? `首饰 <b>${brand.gold}</b> · 溢价 ${Math.round(brand.premium)}%` : ''}</span></div></div>
  </div>`;
}

// ── 热榜 ──
function renderHot(d) {
  $('#hot').innerHTML = d.events.slice(0, 4).map((e, i) => `<a class="row" href="${esc(e.platforms[0]?.url)}" target="_blank" rel="noopener">
    <span class="rk ${i < 3 ? 'top' : ''}">${i + 1}</span><span class="ell">${esc(e.title)}</span><span class="r">${e.platforms.length} 个平台</span></a>`).join('');
}

// ── 宏观 + 财报 ──
let MACRO = null;
function renderMacro(d) {
  MACRO = d;
  const now = Date.now();
  const future = d.macro.filter(m => m.time && new Date(m.time) > now).sort((a, b) => new Date(a.time) - new Date(b.time));
  const next = future.find(m => m.impact === 'High');
  const fomc = future.find(m => m.kind === 'fomc');
  $('#macro').innerHTML = label('下一个高影响事件', 'earnings-calendar') + (next ? `
    <div class="big macro-cd">${cdParts(next.time).map(([n, u]) => `${n}<small>${u}</small>`).join('')}</div>
    <div style="font-size:17px;font-weight:500;margin-top:10px;line-height:1.5" class="ell">${esc(next.title)}</div>
    <div class="sub" style="font-size:13px;margin-top:4px">${fmtCST(next.time)} · ${esc(next.country || '')}${next.forecast ? ` · 预期 ${esc(next.forecast)}` : ''}</div>` : '<div class="loading">暂无</div>') +
    (fomc ? `<div class="kv"><span>下次 FOMC</span><span><b>${cdText(fomc.time)}</b> · ${fmtCST(fomc.time)}</span></div>` : '');

  const week = new Date(d.today_et); week.setDate(week.getDate() + 7);
  const weekISO = week.toISOString().slice(0, 10);
  const ern = d.earnings.filter(e => e.watch && e.date >= d.today_et && e.date <= weekISO).sort((a, b) => a.date.localeCompare(b.date));
  const T = { bmo: '盘前', amc: '盘后', tbd: '待定' };
  $('#ern').innerHTML = `<div class="label">本周关注财报<span class="r">${ern.length} 家 · 关注 ${Object.keys(d.watchlist || {}).length}</span></div>` +
    (ern.length ? `<div class="tickers">${ern.slice(0, 6).map(e => `<div class="tk"><b>${esc(e.symbol)}</b><span class="ell">${e.date.slice(5).replace('-', '/')} ${T[e.time] || ''} · ${esc(e.name.replace(/,? Inc\.?$|\.com|Corporation/g, ''))}</span></div>`).join('')}</div>`
      : '<div class="loading">未来 7 天关注公司没有财报</div>');
}

// ── 竞品 ──
function renderApps(d) {
  const keys = ['hk:1470042146', 'hk:592031984', 'hk:1023600494'];
  const rows = keys.map(k => d.apps.find(a => a.key === k)).filter(Boolean);
  const topics = {};
  d.apps.forEach(a => Object.entries(a.review_stats?.topics || {}).forEach(([k, v]) => topics[k] = (topics[k] || 0) + (typeof v === 'number' ? v : v?.neg || 0)));
  const top = Object.entries(topics).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([id]) => (d.topics || []).find(t => t.id === id)?.name || id);
  const recent = d.apps.filter(a => within(a.version_date, 7)).length;
  $('#apps').innerHTML = `<div class="label">竞品 · 财经榜排名<a class="go" href="${ORIGIN}appstore-tracker/" target="_blank" rel="noopener">appstore-tracker ↗</a></div>` +
    rows.map(a => `<a class="app" href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.icon)}" alt="" onerror="this.style.visibility='hidden'">
      <span class="ell"><b>${esc(a.name)}</b><small>v${esc(a.version)} · ${ago(a.version_date)}</small></span>
      <span class="pos">${a.rank ? '#' + a.rank : '<span class="dim" style="font-size:13px;font-weight:400">未上榜</span>'}</span><span class="star">★ ${a.rating?.toFixed(2) ?? '—'}</span></a>`).join('') +
    `<div class="gripe">7 天内 <b>${recent}</b> 个竞品发版${top.length ? ` · 吐槽最多 <b>${top.map(esc).join('、')}</b>` : ''}</div>`;
}

// ── 短剧 ──
let dramaTimer = null;
function renderDrama([p, d]) {
  const items = p.items.slice(0, 6);
  const week = d.ai.filter(n => within(n.time, 7));
  const c = { positive: 0, neutral: 0, negative: 0 };
  week.forEach(n => c[n.sentiment]++);
  $('#drama').innerHTML = label('本周热门短剧', 'short-drama') + `<div class="drama">${items.map((i, k) => `<a class="slide ${k ? '' : 'on'}" href="${ORIGIN}short-drama/" target="_blank" rel="noopener">
      <div class="cv">${i.cover ? `<img src="${ORIGIN}short-drama/${esc(i.cover)}" alt="" onerror="this.remove()">` : ''}</div>
      <div style="min-width:0"><b>${esc(i.title)}</b><div class="tag">${esc(i.form)} · ${esc(i.rank_note.split('；')[0])}</div><p>${esc(i.synopsis || '')}</p></div></a>`).join('')}</div>
    <div class="senti"><div class="k"><span>AI 对行业影响 · 近 7 天 ${week.length} 篇</span><span><span class="down">正 ${c.positive}</span> · 中 ${c.neutral} · <span class="up">负 ${c.negative}</span></span></div>
      <div class="seg" style="margin:0"><i style="flex:${c.positive || 0.0001};background:var(--ok)"></i><i style="flex:${c.neutral || 0.0001};background:var(--text-3)"></i><i style="flex:${c.negative || 0.0001};background:var(--err)"></i></div></div>`;
  clearInterval(dramaTimer);
  let cur = 0;
  dramaTimer = setInterval(() => {
    const s = document.querySelectorAll('#drama .slide');
    if (s.length < 2) return;
    s[cur].classList.remove('on'); cur = (cur + 1) % s.length; s[cur].classList.add('on');
  }, 8000);
}

// ── 拼假 ──
function renderHoliday(d) {
  const s = d.summary, n = s.next, md = t => `${+t.slice(5, 7)}/${+t.slice(8)}`;
  $('#holiday').innerHTML = label(`拼假<span class="dim" style="margin-left:4px">· ${s.plan_year} ${s.plan_official ? '官方安排' : '预估'}</span>`, 'holiday-planner') +
    `<div style="display:flex;gap:28px;min-height:0;flex:1">
      <div style="flex-shrink:0">${n ? `<div class="big macro-cd">${n.days}<small>天</small></div>
        <div style="font-size:15px;font-weight:500;margin-top:10px">${esc(n.name)} · ${md(n.date)}${n.est ? '<span class="dim">（预估）</span>' : ''}</div>
        <div class="sub" style="font-size:13px;margin-top:4px">还要上 ${n.workdays} 天班</div>` : '<div class="loading">暂无</div>'}</div>
      <div class="rows" style="flex:1;min-width:0">${s.top.slice(0, 3).map(p => `<div class="row" style="height:auto;padding:7px 0">
        <span class="ell">${esc(p.names.join('、'))} <span class="dim">${md(p.from)}–${md(p.to)}</span></span><span class="r">请 ${p.used} → 休 <b style="color:var(--text-1)">${p.len}</b></span></div>`).join('')}</div>
    </div>`;
}

// ── 站点健康 ──
let HEALTH = null;
function renderHealth() {
  if (!HEALTH) return;
  const rs = HEALTH.repos;
  const n = l => rs.filter(r => r.level === l).length;
  const ok = n('ok');
  const sites = rs.map(r => {
    const wf = r.workflows || [];
    const hasCron = wf.some(w => w.cron);
    const last = wf.map(w => w.last_run?.created_at).filter(Boolean).sort().pop();
    const left = Math.max(0, Math.min(60, r.days_left ?? 0));
    const lc = left < 7 ? 'var(--err)' : left < 14 ? 'var(--warn)' : 'var(--text-2)';
    const issue = r.issues[0]?.text;
    return `<a class="site ${r.level === 'error' ? 'bad' : r.level === 'warn' ? 'warning' : ''}" href="${esc(r.level === 'ok' ? r.page : r.repo_url + '/actions')}" target="_blank" rel="noopener" title="${esc(r.issues.map(i => i.text).join('\n') || '运行正常')}">
      <span class="st" style="background:${LV[r.level]}"></span>
      <span class="nm"><b>${esc(r.name)}</b><small style="color:${issue ? LV[r.level] : 'var(--text-3)'}">${esc(issue || (hasCron ? wf.filter(w => w.cron).map(w => w.interval_h >= 24 ? '每天' : `每 ${w.interval_h} 小时`).join(' · ') : '静态页面'))}</small></span>
      <span class="when">${wf.length ? ago(last) : '—'}</span>
      ${hasCron ? `<span class="life"><i style="width:${left / 60 * 100}%;background:${lc}"></i></span><span class="left">${Math.round(left)} 天</span>` : '<span></span><span></span>'}
    </a>`;
  }).join('');
  $('#health').innerHTML = `<div class="label">站点健康<span class="r">检查于 ${ago(HEALTH.updated)}</span></div>
    <div class="h-head"><span class="big">${ok}<span style="color:var(--text-3)"> / ${rs.length}</span></span><span class="sub">个站点运行正常</span></div>
    <div class="chips"><span class="chip" style="--c:var(--ok)">正常 ${ok}</span><span class="chip" style="--c:var(--warn)">注意 ${n('warn')}</span><span class="chip" style="--c:var(--err)">异常 ${n('error')}</span>
      <span class="chip" style="--c:transparent;margin-left:auto">右侧 = 距 60 天停用剩余</span></div>
    <div class="sites">${sites}</div>`;
}

// ── 加载 ──
const SOURCES = [
  [() => getJSON(ORIGIN + 'fx-board/data.json'), renderFx, '#fx'],
  [() => getJSON(ORIGIN + 'oil-gold/data.json'), renderOil, '#oil'],
  [() => getJSON(ORIGIN + 'savings-rates/data.json'), renderSave, '#save'],
  [() => getJSON(ORIGIN + 'health-weekly/data.json'), renderResp, '#resp'],
  [() => getJSON(ORIGIN + 'hot-news/data.json'), renderHot, '#hot'],
  [() => getJSON(ORIGIN + 'earnings-calendar/data.json'), renderMacro, '#macro'],
  [() => getJSON(ORIGIN + 'appstore-tracker/data.json'), renderApps, '#apps'],
  [() => Promise.all([getJSON(ORIGIN + 'short-drama/picks.json'), getJSON(ORIGIN + 'short-drama/data.json')]), renderDrama, '#drama'],
  [() => getJSON(ORIGIN + 'holiday-planner/data.json'), renderHoliday, '#holiday'],
];
let nextAt = Date.now() + REFRESH_MS;
async function load() {
  nextAt = Date.now() + REFRESH_MS;
  await Promise.allSettled([
    getJSON('health.json').then(h => { HEALTH = h; renderHealth(); }).catch(() => {}),
    ...SOURCES.map(([fetcher, render, el]) => fetcher().then(d => {
      try { render(d); } catch (e) { console.warn('[Screen]', render.name, e); if (el) $(el).insertAdjacentHTML('beforeend', '<div class="loading">数据格式已变化</div>'); }
    }).catch(e => { const box = el && $(el), ld = box?.querySelector('.loading'); if (ld) ld.textContent = `读取失败（${e.message}）`; })),
  ]);
}

// ── 画布缩放、时钟、全屏 ──
function fit() {
  const st = $('#stage');
  if (innerWidth <= 760) { st.style.transform = ''; return; }
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  st.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
function tick() {
  const now = new Date();
  $('#clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
  $('#date').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
  const left = Math.max(0, nextAt - Date.now()) / 1000;
  $('#metaLine').textContent = `${Math.ceil(left / 60)} 分钟后刷新`;
}
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
$('#fs').addEventListener('click', toggleFs);
document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) toggleFs(); });
addEventListener('resize', fit);

fit();
tick();
setInterval(tick, 1000);
setInterval(() => { if (MACRO) renderMacro(MACRO); if (HEALTH) renderHealth(); }, 60 * 1000);   // 倒计时、相对时间每分钟更新
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
