<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Pages · 今日</title>
  <meta name="description" content="所有 GitHub Pages 站点的入口与今日要点">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%238b9cff'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0b0c;
      --card: #151517;
      --card-2: #1c1c1f;
      --hair: rgba(255,255,255,0.06);
      --hair-2: rgba(255,255,255,0.10);
      --text-1: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #6e6e73;
      --accent: #8b9cff;
      --up: #ff6b6b;
      --down: #3ddc97;
      --ok: #3ddc97;
      --warn: #f5b94a;
      --err: #ff6b6b;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text-1); overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      font-feature-settings: 'tnum' 1, 'cv11' 1;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* 1920×1080 画布，等比缩放铺满窗口 */
    #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0;
      padding: 26px 40px 32px; display: grid; grid-template-rows: 52px 1fr; gap: 18px;
      background: radial-gradient(1100px 380px at 50% -120px, rgba(139,156,255,0.10), transparent 70%); }

    header { display: flex; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: baseline; gap: 14px; }
    .brand b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    .brand b::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(139,156,255,0.18); }
    .brand span { color: var(--text-2); font-size: 16px; }
    .spacer { flex: 1; }
    .meta { color: var(--text-3); font-size: 13px; }
    .clock { font-size: 24px; font-weight: 500; letter-spacing: -0.01em; min-width: 72px; text-align: right; }
    .pill { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--hair-2); color: var(--text-2); font-size: 13.5px; display: inline-flex; align-items: center; }
    .pill:hover { color: var(--text-1); border-color: rgba(255,255,255,0.22); }
    /* 站点健康：胶囊 + 每站一个小点（悬停看站名和问题） */
    .hp { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--hair-2); font-size: 13.5px; color: var(--text-2); }
    .hp b { color: var(--text-1); font-weight: 600; }
    .dots { display: flex; gap: 4px; }
    .dots a { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); position: relative; }
    .dots a.ok { background: var(--ok); } .dots a.warn { background: var(--warn); } .dots a.error { background: var(--err); }
    .dots a:hover::after { content: attr(data-t); position: absolute; top: 16px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: #000;
      border: 1px solid var(--hair-2); color: var(--text-1); font-size: 12px; padding: 4px 8px; border-radius: 6px; z-index: 5; }

    /* 便当格：7 列 × 5 行 */
    .bento { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 14px; min-height: 0; }
    .card { position: relative; background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: 16px 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s; }
    a.card:hover { border-color: var(--hair-2); }
    .label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); font-weight: 500; white-space: nowrap; position: relative; z-index: 2; min-width: 0; }
    .label .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .label .go { margin-left: auto; color: var(--text-3); font-size: 12px; font-weight: 400; flex-shrink: 0; }
    a.card:hover .label .go { color: var(--text-1); }
    .label .hd { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .hd.warn { background: var(--warn); } .hd.error { background: var(--err); }
    .big { font-weight: 600; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
    .big small { font-size: .42em; font-weight: 500; color: var(--text-2); letter-spacing: 0; margin-left: 3px; }
    .sub { color: var(--text-2); font-size: 13px; }
    .dim { color: var(--text-3); }
    .up { color: var(--up); } .down { color: var(--down); }
    .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .loading { color: var(--text-3); font-size: 13px; margin-top: auto; }

    /* 小格：标题 / 大数字 / 两行简要 */
    .mini .big { font-size: 38px; margin-top: auto; overflow: hidden; text-overflow: ellipsis; }
    .mini .l1 { margin-top: 9px; } .mini .l2 { margin-top: 1px; color: var(--text-3); }

    /* 封面卡：图铺满，底部渐变压字 */
    .cover { padding: 0; }
    .cover .bg { position: absolute; inset: 0; background: center / cover no-repeat var(--card-2); transition: transform .6s; }
    a.cover:hover .bg { transform: scale(1.04); }
    .cover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(11,11,12,.6) 0%, rgba(11,11,12,0) 26%, rgba(11,11,12,.35) 48%, rgba(11,11,12,.96) 100%); }
    .cover .label { padding: 14px 18px 0; color: rgba(255,255,255,.85); }
    .cover .label .go { color: rgba(255,255,255,.6); }
    .cover .body { position: relative; z-index: 2; margin-top: auto; padding: 0 18px 16px; }
    .cover .tt { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cover .sub { color: rgba(255,255,255,.72); margin-top: 4px; }
    .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: rgba(139,156,255,.22); color: #c9d0ff; margin: 0 6px 6px 0; }

    /* 位置 */
    .k-fx { grid-column: 1 / 3; grid-row: 1 / 3; padding: 20px 22px; }
    .k-hot { grid-column: 3 / 5; grid-row: 1 / 3; padding: 0; }
    .k-drama { grid-column: 5; grid-row: 1 / 3; }
    .k-weekly { grid-column: 1 / 3; }
    .k-weekend { grid-column: 3 / 5; }
    .k-tools { grid-column: span 3; }

    /* 市场 · 汇率：三大指数、今日异动（logo 方块）、底部一行汇率 */
    .fx-pairs { display: flex; gap: 20px; margin-top: 14px; }
    .fx-pairs div { display: flex; flex-direction: column; }
    .fx-pairs span { font-size: 12px; color: var(--text-3); }
    .fx-pairs b { font-size: 18px; font-weight: 600; }
    .fx-pairs i { font-style: normal; font-size: 12px; }
    .mv-title { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin-top: 14px; }
    .mv-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .mv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-width: 0; padding: 8px 4px; border-radius: 12px; background: var(--card-2); }
    .mv.up { background: linear-gradient(180deg, rgba(242,85,90,.16), var(--card-2) 75%); }
    .mv.down { background: linear-gradient(180deg, rgba(34,192,138,.16), var(--card-2) 75%); }
    .mv-logo { position: relative; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0; display: grid; place-items: center;
      background: hsl(var(--h) 42% 46%); color: #fff; font-weight: 700; font-size: 17px; }
    .mv-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .mv-n { font-size: 12px; color: var(--text-2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mv-p { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .fx-line { display: flex; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
    .fx-line b { color: var(--text-1); font-weight: 600; margin: 0 4px; font-variant-numeric: tabular-nums; }

    /* 热榜：上半头图，下半榜单 */
    .hero { position: relative; height: 52%; overflow: hidden; flex-shrink: 0; }
    .hero .bg { position: absolute; inset: 0; background: center / cover no-repeat var(--card-2); transition: transform .6s; }
    .k-hot:hover .hero .bg { transform: scale(1.04); }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,12,.6), rgba(11,11,12,0) 30%, rgba(21,21,23,0) 50%, var(--card) 100%); }
    .hero .label { position: absolute; top: 14px; left: 18px; right: 18px; color: rgba(255,255,255,.85); }
    .hero .label .go { color: rgba(255,255,255,.6); }
    .hero .tt { position: absolute; left: 18px; right: 18px; bottom: 8px; z-index: 2; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    .k-hot.noimg .hero { height: auto; padding: 16px 18px 6px; } .k-hot.noimg .hero::after { display: none; }
    .k-hot.noimg .hero .label { position: static; color: var(--text-2); } .k-hot.noimg .hero .tt { position: static; margin-top: 12px; }
    .rows { display: flex; flex-direction: column; padding: 4px 18px 12px; flex: 1; justify-content: space-evenly; min-height: 0; }
    .row { display: flex; align-items: center; gap: 12px; height: 34px; font-size: 14.5px; border-bottom: 1px solid var(--hair); min-width: 0; }
    .row:last-child { border-bottom: 0; }
    .rk { width: 16px; flex-shrink: 0; color: var(--text-3); font-weight: 600; font-size: 13px; }
    .rk.top { color: var(--text-1); }
    .row .r { margin-left: auto; color: var(--text-3); font-size: 12.5px; white-space: nowrap; flex-shrink: 0; }
    .row .th { width: 46px; height: 28px; border-radius: 5px; flex-shrink: 0; background: center / cover no-repeat var(--card-2); }

    /* 本周上新：海报 */
    .posters { display: grid; grid-template-columns: repeat(3, 76px) minmax(0, 1fr); gap: 10px; margin-top: 10px; flex: 1; min-height: 0; }
    .posters i { border-radius: 8px; background: center / cover no-repeat var(--card-2); }
    .posters .info { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; padding-left: 6px; }
    .posters .info .big { font-size: 36px; }
    /* 周末：展览海报 + 天气 */
    .wk { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; margin-top: 10px; flex: 1; min-height: 0; }
    .wk i { border-radius: 8px; background: center / cover no-repeat var(--card-2); }
    .wk .r2 { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
    .wk-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
    .wk-body .days { display: flex; gap: 8px; }
    .wk-body .days div { background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 6px 10px; }
    .wk-body .days b { font-size: 16px; font-weight: 600; display: block; white-space: nowrap; }
    .wk-body .days span { font-size: 11.5px; color: rgba(255,255,255,.75); white-space: nowrap; }
    /* 车市：车图 */
    .car-img { position: absolute; right: 6px; top: 34px; width: 50%; opacity: .9; pointer-events: none; }
    .k-car .big, .k-car .sub { position: relative; z-index: 1; }
    /* 赛程：队徽 vs 队徽 */
    .vs { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding: 0 6px; }
    .vs img { width: 52px; height: 52px; object-fit: contain; }
    .vs span { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    /* 竞品：图标 */
    .icons { display: flex; gap: 7px; margin-top: 10px; }
    .icons img { width: 32px; height: 32px; border-radius: 8px; background: var(--card-2); }
    /* 工具 */
    .tools { display: flex; gap: 10px; margin-top: auto; }
    .tools a { flex: 1; min-width: 0; background: var(--card-2); border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 600; transition: color .15s; }
    .tools a span { display: block; font-size: 12px; color: var(--text-3); font-weight: 400; margin-top: 2px; }
    .tools a:hover { color: var(--accent); }

    /* 手机：取消画布缩放，两列可滚动 */
    @media (max-width: 760px) {
      body { overflow: auto; }
      #stage { position: static; width: auto; height: auto; transform: none !important; padding: 16px 14px 28px; display: block; background: none; }
      header { flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      .meta, .clock, #fs { display: none; }
      .hp { order: 3; width: 100%; height: auto; padding: 8px 12px; flex-wrap: wrap; border-radius: 12px; row-gap: 6px; }
      #hpText { white-space: nowrap; } .dots { flex-wrap: wrap; }
      .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: 158px; gap: 10px; }
      .bento > * { grid-column: auto !important; grid-row: auto !important; }
      .k-fx, .k-hot { grid-column: 1 / 3 !important; grid-row: span 2 !important; }
      .k-drama { grid-row: span 2 !important; }
      .k-weekly, .k-weekend, .k-tools { grid-column: 1 / 3 !important; }
      .mv-logo { width: 38px; height: 38px; } .mini .big { font-size: 30px; }
      .tools { flex-direction: column; gap: 6px; } .k-tools { grid-row: span 2 !important; }
    }
  </style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><b>Pages</b><span id="date"></span></div>
    <div class="spacer"></div>
    <span class="hp" id="hp"><span id="hpText">检查中…</span><span class="dots" id="dots"></span></span>
    <span class="meta" id="metaLine"></span>
    <span class="clock" id="clock">--:--</span>
    <button class="pill" id="fs" title="全屏（F）">全屏</button>
    <a class="pill" href="detail.html">详情</a>
  </header>
  <div class="bento" id="bento"></div>
</div>

<script src="sites.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ?origin=http://localhost:端口/ 可让大屏读本地各站数据（推送前联调用），默认读线上
const ORIGIN = new URLSearchParams(location.search).get('origin') || 'https://climb0516.github.io/';
const REFRESH_MS = 10 * 60 * 1000;
const SUPABASE_URL = 'https://sqrzrvstlvxqxdxvhlxz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxcnpydnN0bHZ4cXhkeHZobHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTUzMjAsImV4cCI6MjA5NjU5MTMyMH0.C6Gz61TB3GhLnbDWywogGZDcqTu1G2ta9-Dyo60Yiho';   // tech-news 页面公开的 anon 只读 key
const SITES = window.PAGES_SITES || [];
const siteUrl = repo => SITES.find(s => s.repo === repo)?.url || ORIGIN + repo + '/';

// ── 工具（与 detail.html 保持一致） ──
const getJSON = (url, opt = {}) => fetch(url, { cache: 'no-cache', ...opt }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
function ago(t) {
  if (!t) return '—';
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
function cdParts(t) {                                   // 倒计时拆成 [[数, 单位], ...]，只取前两段
  const s = Math.max(0, (new Date(t) - Date.now()) / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? [[d, '天'], [h, '时']] : h ? [[h, '时'], [m, '分']] : [[m, '分钟']]);
}
const fmtCST = t => new Date(t).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
const pct = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(2)}%`;
const cls = v => v > 0.0001 ? 'up' : v < -0.0001 ? 'down' : 'dim';
const within = (t, days) => t && Date.now() - new Date(t) < days * 86400000;
const todayCN = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400e3);
const md = t => `${+t.slice(5, 7)}/${+t.slice(8, 10)}`;
const bgUrl = u => `url('${String(u).replace(/'/g, '%27')}')`;

// 卡片外壳：整张卡片是进站链接；标题前的小圆点来自健康检查
let HEALTH = null;
const lvOf = repo => HEALTH?.repos?.find(r => r.name === repo)?.level;
function label(title, repo) {
  const lv = lvOf(repo);
  return `<div class="label">${lv === 'warn' || lv === 'error' ? `<i class="hd ${lv}"></i>` : ''}<span class="t">${title}</span><span class="go">${repo} ↗</span></div>`;
}
const mini = (title, repo, big, l1, l2) => label(title, repo) + `<div class="big">${big}</div><div class="sub l1 ell">${l1}</div><div class="sub l2 ell">${l2}</div>`;

// ── 各站卡片：key 对应格子，load 拉数据，render 返回卡片内部 HTML ──
const CARDS = [
  // 市场 · 汇率：三大指数 + 今日异动（market-board 重点股票里涨跌幅最大的 4 只，带 logo）+ 一行汇率
  { key: 'fx', repo: 'market-board', load: () => Promise.all([getJSON(ORIGIN + 'market-board/market.json'), getJSON(ORIGIN + 'market-board/fx.json'), getJSON(ORIGIN + 'market-board/config.json')]), render([m, d, cfg]) {
    const IDX = [['1.000001', '上证指数'], ['100.HSI', '恒生指数'], ['100.NDX', '纳斯达克100']];
    const num2 = v => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const idx = IDX.map(([id, n]) => { const q = m.quotes?.[id];
      return `<div><span>${n}</span><b>${typeof q?.f2 === 'number' ? num2(q.f2) : '—'}</b><i class="${cls(q?.f3 ?? 0)}">${typeof q?.f3 === 'number' ? pct(q.f3) : ''}</i></div>`; }).join('');
    const movers = Object.values(cfg.stocks || {}).flat().map(id => ({ id, q: m.quotes?.[id] }))
      .filter(x => typeof x.q?.f3 === 'number').sort((a, b) => Math.abs(b.q.f3) - Math.abs(a.q.f3)).slice(0, 4);
    const tile = ({ id, q }) => {
      let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360;
      const name = String(q.f14 || id).replace(/-[A-Z]+$/, '');
      return `<div class="mv ${cls(q.f3)}"><span class="mv-logo" style="--h:${h}">${esc(name.charAt(0))}<img src="${ORIGIN}market-board/logos/${esc(id)}.png" alt="" loading="lazy" onerror="this.remove()"></span>
        <span class="mv-n">${esc(name)}</span><span class="mv-p ${cls(q.f3)}">${pct(q.f3)}</span></div>`;
    };
    const R = d.ref.rates, days = Object.keys(d.history).sort();
    const h = (day, a, b) => { const x = { USD: 1, ...d.history[day] }; return x[b] / x[a]; };
    const chg = (a, b) => (h(days.at(-1), a, b) / h(days.at(-2), a, b) - 1) * 100;
    const fx = [['USD', 'CNY'], ['HKD', 'CNY']].map(([a, b]) => { const x = chg(a, b);
      return `<span>${a}/${b}<b>${(R[b] / R[a]).toFixed(4)}</b><i class="${cls(x)}" style="font-style:normal">${pct(x)}</i></span>`; }).join('');
    return label('市场 · 汇率', 'market-board') + `
      <div class="fx-pairs">${idx}</div>
      <div class="mv-title"><span>今日异动</span><span>快照 ${fmtCST(m.updated)}</span></div>

    if (!vs) return mini('赛程', 'match-day', `${todays.length}<small>场今天</small>`,
      pick ? `${esc(pick.sport === 'esports' ? pick.game : pick.league)} · ${esc(pick.home && pick.away ? `${pick.home} vs ${pick.away}` : pick.stage || '')}` : '暂无重点比赛',
      pick ? when(pick) + (pick.china ? ' · 中国' : '') : '');
    const e = withLogo;
    return label(`赛程 · 今天 ${todays.length} 场`, 'match-day') + vs +
      `<div class="sub l1 ell">${esc(e.home)} vs ${esc(e.away)}</div><div class="sub l2 ell">${esc(e.sport === 'esports' ? e.game : e.league)} · ${when(e).split(' ')[0]}${e.china ? ' · 中国' : ''}</div>`;
  } },

  { key: 'tech', repo: 'tech-news', cover: true, load: () => getJSON(`${SUPABASE_URL}/rest/v1/news_items?select=title,source,date,image_url&order=date.desc,created_at.desc&limit=60`,
      { cache: 'no-store', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }), render(rows) {
    const today = todayCN(), n = rows.filter(r => r.date === today).length;
    const top = rows.find(r => r.image_url) || rows[0];
    return (top?.image_url ? `<div class="bg" style="background-image:${bgUrl(top.image_url)}"></div>` : '') + label('科技动态', 'tech-news') +
      `<div class="body"><span class="chip">今天 ${n} 条</span><div class="tt">${esc(top?.title || '—')}</div><div class="sub ell">${esc(top?.source || '')} · ${top ? md(top.date) : ''}</div></div>`;
  } },

  { key: 'ios', repo: 'ios-dev-news', load: () => getJSON(ORIGIN + 'ios-dev-news/data.json'), render(d) {
    const rel = d.items.filter(i => i.kind === 'release');
    const latest = (p, stable) => rel.filter(i => i.platform === p && (stable ? i.stage === '正式版' : true)).sort((a, b) => b.date.localeCompare(a.date))[0];
    const xs = latest('Xcode', true), xb = latest('Xcode'), is = latest('iOS', true);
    const n7 = d.items.filter(i => within(i.date, 7)).length;
    return mini('iOS 开发动态', 'ios-dev-news', `${esc(xs?.version || '—')}<small>Xcode</small>`,
      xb && xb !== xs ? `${esc(xb.version)} ${esc(xb.stage)} 进行中` : `iOS ${esc(is?.version || '—')}`, `近 7 天 ${n7} 条动态`);
  } },
];

// 格子顺序（auto-flow 依次填入 7×5）
const LAYOUT = ['fx', 'hot', 'drama', 'macro', 'save', 'oil', 'dca', 'weekly', 'weekend', 'game', 'car', 'apps',
  'recall', 'food', 'home', 'resp', 'rules', 'holiday', 'ticket', 'exam', 'match', 'tech', 'ios', 'tools'];
let MACRO = null, DRAMA = [], dramaIdx = 0;
const byKey = Object.fromEntries(CARDS.map(c => [c.key, c]));
const cache = {};

function shell() {
  $('#bento').innerHTML = LAYOUT.map(k => {
    if (k === 'tools') return `<div class="card k-tools" id="k-tools"></div>`;
    const c = byKey[k];
    return `<a class="card k-${k} ${c.cover ? 'cover' : ''} ${(['fx', 'hot', 'weekly', 'apps'].includes(k) || c.cover) ? '' : 'mini'}" id="k-${k}" href="${siteUrl(c.repo)}${c.hash || ''}" target="_blank" rel="noopener">
      ${label(SITES.find(s => s.repo === c.repo)?.name || c.repo, c.repo)}<div class="loading">加载中…</div></a>`;
  }).join('');
}
function renderCard(k) {
  const c = byKey[k], el = document.getElementById('k-' + k);
  if (!el || !(k in cache)) return;
  const x = cache[k];
  if (x.error) { el.innerHTML = label(SITES.find(s => s.repo === c.repo)?.name || c.repo, c.repo) + `<div class="loading">读取失败（${esc(x.error)}）</div>`; return; }
  try { el.innerHTML = c.render(x.data, el); }
  catch (e) { console.warn('[Screen]', k, e); el.innerHTML = label(SITES.find(s => s.repo === c.repo)?.name || c.repo, c.repo) + '<div class="loading">数据格式已变化</div>'; }
}
// 工具格：清单里的工具页 + 还没有专属卡片的新站点（自动出现，不用改布局）
function renderTools() {
  const known = new Set(CARDS.map(c => c.repo));
  const list = SITES.filter(s => s.kind === 'tool' || (s.kind === 'data' && !known.has(s.repo)));
  $('#k-tools').innerHTML = `<div class="label"><span class="t">工具 · 其他站点</span><span class="go">${list.length} 个</span></div>
    <div class="tools">${list.map(s => `<a href="${siteUrl(s.repo)}" target="_blank" rel="noopener">${esc(s.name)}<span>${esc(s.desc || (s.kind === 'data' ? '新站点' : s.repo))} ↗</span></a>`).join('')}</div>`;
}
function renderHealth() {
  const rs = HEALTH?.repos || [];
  const items = SITES.map(s => ({ s, h: rs.find(r => r.name === s.repo) }));
  const checked = items.filter(x => x.h), bad = checked.filter(x => x.h.level === 'error'), warn = checked.filter(x => x.h.level === 'warn');
  $('#hpText').innerHTML = HEALTH ? `<b>${checked.length - bad.length - warn.length}</b> / ${SITES.length} 正常` +
    (warn.length ? ` · <span style="color:var(--warn)">${warn.length} 注意</span>` : '') + (bad.length ? ` · <span style="color:var(--err)">${bad.length} 异常</span>` : '') +
    (checked.length < SITES.length ? ` · <span class="dim">${SITES.length - checked.length} 待检查</span>` : '') : '健康检查读取失败';
  $('#dots').innerHTML = items.map(({ s, h }) => `<a class="${h?.level || ''}" href="${esc(h?.repo_url ? h.repo_url + '/actions' : siteUrl(s.repo))}" target="_blank" rel="noopener"
    data-t="${esc(s.name)} · ${h ? (h.level === 'ok' ? '正常' : esc(h.issues?.[0]?.text || h.level)) : '尚未纳入健康检查'}"></a>`).join('');
  $('#hp').title = HEALTH ? `健康检查于 ${ago(HEALTH.updated)}` : '';
}

let nextAt = Date.now() + REFRESH_MS;
async function load() {
  nextAt = Date.now() + REFRESH_MS;
  const h = getJSON('health.json').then(x => { HEALTH = x; }).catch(() => {});
  await Promise.allSettled(CARDS.map(c => c.load().then(data => { cache[c.key] = { data }; }).catch(e => { cache[c.key] = { error: e.message }; })
    .finally(() => renderCard(c.key))));
  await h;
  renderHealth();
  LAYOUT.forEach(k => k !== 'tools' && renderCard(k));          // 拿到健康数据后刷新卡片标题前的状态点
}

// ── 画布缩放、时钟、全屏 ──
function fit() {
  const st = $('#stage');
  if (innerWidth <= 760) { st.style.transform = ''; return; }
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  st.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
function tick() {
  const now = new Date();
  $('#clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
  $('#date').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
  $('#metaLine').textContent = `${Math.ceil(Math.max(0, nextAt - Date.now()) / 60000)} 分钟后刷新`;
}
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
$('#fs').addEventListener('click', toggleFs);
document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) toggleFs(); });
addEventListener('resize', fit);

shell();
renderTools();
fit();
tick();
setInterval(tick, 1000);
setInterval(() => { if (MACRO) renderCard('macro'); }, 60 * 1000);                                // 倒计时每分钟更新
setInterval(() => { if (DRAMA.length > 1) { dramaIdx = (dramaIdx + 1) % DRAMA.length; renderCard('drama'); } }, 8000);   // 短剧封面轮播
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
